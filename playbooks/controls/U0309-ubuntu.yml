---
- name: U0309 Ubuntu root SSH 직접 접속 제한
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: Ubuntu가 아닌 호스트 제외 안내
      ansible.builtin.debug:
        msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }}은
          U0309-ubuntu.yml 적용 대상이 아니므로 제외합니다.
      when: ansible_distribution != 'Ubuntu'

    - name: Ubuntu가 아닌 호스트 제외
      ansible.builtin.meta: end_host
      when: ansible_distribution != 'Ubuntu'

  tasks:
    - name: U0309 Ubuntu 조치 실행
      ansible.builtin.import_role:
        name: security_controls
        tasks_from: u0309_ubuntu
