---
- name: U0307 서비스 Banner 사용 현황 점검
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 20
  max_fail_percentage: 0

  pre_tasks:
    - name: U0307 점검 지원 운영체제 확인
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['os_family'] == 'RedHat'
            or ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: >-
          U0307 점검을 지원하지 않는 OS입니다:
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}

  tasks:
    - name: U0307 Red Hat 계열 점검 실행
      ansible.builtin.include_role:
        name: security_controls
        tasks_from: u0307_check_redhat
      when: ansible_facts['os_family'] == 'RedHat'

    - name: U0307 Ubuntu 점검 실행
      ansible.builtin.include_role:
        name: security_controls
        tasks_from: u0307_check_ubuntu
      when: ansible_facts['distribution'] == 'Ubuntu'
