---
- name: U0308 Red Hat 계열 Session Timeout 설정
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: Red Hat 계열이 아닌 호스트 제외 안내
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}은
          U0308-redhat.yml 적용 대상이 아니므로 제외합니다.
      when: ansible_facts['os_family'] != 'RedHat'

    - name: Red Hat 계열이 아닌 호스트 제외
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'RedHat'

  tasks:
    - name: U0308 Red Hat 계열 조치 실행
      ansible.builtin.import_role:
        name: security_controls
        tasks_from: u0308_redhat
