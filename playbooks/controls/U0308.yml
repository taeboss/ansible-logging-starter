---
- name: U0308 Session Timeout 설정
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: U0308 지원 운영체제 확인
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['os_family'] == 'RedHat'
            or ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: >-
          U0308 조치를 지원하지 않는 OS입니다:
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}

  tasks:
    - name: U0308 Red Hat 계열 조치 실행
      ansible.builtin.include_role:
        name: security_controls
        tasks_from: u0308_redhat
      when: ansible_facts['os_family'] == 'RedHat'

    - name: U0308 Ubuntu 조치 실행
      ansible.builtin.include_role:
        name: security_controls
        tasks_from: u0308_ubuntu
      when: ansible_facts['distribution'] == 'Ubuntu'
