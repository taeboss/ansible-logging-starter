---
- name: 주간 로그 용량 및 설정 무결성 점검
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 20

  pre_tasks:
    - name: 로컬 주간점검 보고서 디렉터리 생성
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/weekly/{{ ansible_date_time.date }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

  tasks:
    - name: 로그 파일시스템 사용률 조회
      ansible.builtin.shell: |
        set -o pipefail
        df -P /var/log | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }'
      args:
        executable: /bin/bash
      register: log_usage
      changed_when: false
      failed_when: false

    - name: 로그 용량 경고
      ansible.builtin.debug:
        msg: >-
          WARNING: /var/log usage={{ log_usage.stdout }}%,
          threshold={{ log_filesystem_warning_percent }}%
      when: >-
        log_usage.stdout | int >= log_filesystem_warning_percent | int

    - name: 로그 파일시스템 inode 사용률 조회
      ansible.builtin.shell: |
        set -o pipefail
        df -Pi /var/log | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }'
      args:
        executable: /bin/bash
      register: log_inode_usage
      changed_when: false

    - name: journal 사용량 조회
      ansible.builtin.command: journalctl --disk-usage
      register: journal_disk_usage
      changed_when: false
      failed_when: false

    - name: audit 규칙 파일 체크섬 수집
      ansible.builtin.stat:
        path: /etc/audit/rules.d/50-security-baseline.rules
        checksum_algorithm: sha256
      register: audit_rules_stat

    - name: audit 설정 및 서비스 확인
      ansible.builtin.command: auditctl -s
      register: audit_status
      changed_when: false

    - name: journald 설정 확인
      ansible.builtin.command: systemd-analyze cat-config systemd/journald.conf
      register: journald_config
      changed_when: false
      failed_when: false

    - name: 주간 점검 결과 표시
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          log_usage_percent: "{{ log_usage.stdout | int }}"
          audit_rules_sha256: >-
            {{ audit_rules_stat.stat.checksum | default('missing') }}
          audit_status: "{{ audit_status.stdout_lines }}"

    - name: 서버별 주간점검 보고서 저장
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/weekly/{{ ansible_date_time.date }}/{{ inventory_hostname }}-{{ ansible_date_time.time | regex_replace(':', '') }}.json"
        mode: "0600"
        content: >-
          {{
            {
              'collected_at': ansible_date_time.iso8601,
              'inventory_hostname': inventory_hostname,
              'log_usage_query_succeeded': log_usage.rc == 0 and log_usage.stdout | trim != '',
              'log_usage_percent': log_usage.stdout | int,
              'log_inode_usage_percent': log_inode_usage.stdout | int,
              'journal_disk_usage': journal_disk_usage.stdout_lines | default([]),
              'audit_rules_sha256': audit_rules_stat.stat.checksum | default('missing'),
              'audit_status': audit_status.stdout_lines | default([]),
              'journald_config': journald_config.stdout_lines | default([])
            } | to_nice_json
          }}
      delegate_to: localhost
      become: false

    - name: 로그 파일시스템 임계치 검증
      ansible.builtin.assert:
        that:
          - log_usage.rc == 0
          - log_usage.stdout | trim != ''
          - log_usage.stdout | int < log_filesystem_critical_percent | int
        fail_msg: >-
          {{ inventory_hostname }} /var/log 사용률이 위험 기준을 초과했습니다.
          usage={{ log_usage.stdout }}%,
          critical={{ log_filesystem_critical_percent }}%
