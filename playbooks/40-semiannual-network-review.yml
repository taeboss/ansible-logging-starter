---
- name: 반기 네트워크 서비스 현황 수집
  hosts: linux_servers
  gather_facts: true
  become: true

  pre_tasks:
    - name: 로컬 보고서 디렉터리 생성
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/network"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
    - name: LISTEN 소켓 수집
      ansible.builtin.command: ss -lntup
      register: listening
      changed_when: false

    - name: 연결된 소켓 수집
      ansible.builtin.command: ss -ntup
      register: connections
      changed_when: false

    - name: 서버별 검토 자료 저장
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/network/{{ inventory_hostname }}-{{ ansible_date_time.date }}.txt"
        mode: "0600"
        content: |
          host={{ inventory_hostname }}
          collected_at={{ ansible_date_time.iso8601 }}
          [LISTENING]
          {{ listening.stdout }}

          [CONNECTIONS]
          {{ connections.stdout }}
      delegate_to: localhost
      become: false
