---
- name: 분기 또는 반기 계정 및 접근 현황 점검
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 20

  pre_tasks:
    - name: 로컬 계정점검 보고서 디렉터리 생성
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/account-access/{{ ansible_date_time.date }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

  tasks:
    - name: UID 0 및 로그인 가능한 계정 수집
      ansible.builtin.shell: |
        uid_min=$(awk '/^UID_MIN[[:space:]]/ { print $2; exit }' /etc/login.defs)
        uid_min=${uid_min:-1000}
        awk -F: -v uid_min="$uid_min" '
          $7 !~ /(nologin|false)$/ {
            if ($3 == 0) class="uid0"
            else if ($3 >= uid_min) class="human_candidate"
            else class="service_login_candidate"
            printf "%s:uid=%s:gid=%s:home=%s:shell=%s:class=%s\n", $1, $3, $4, $6, $7, class
          }
        ' /etc/passwd
      args:
        executable: /bin/bash
      register: login_capable_accounts
      changed_when: false

    - name: 관리자 그룹 구성원 수집
      ansible.builtin.shell: |
        getent group sudo 2>/dev/null || true
        getent group wheel 2>/dev/null || true
      args:
        executable: /bin/bash
      register: administrative_groups
      changed_when: false

    - name: 계정 잠금 및 만료 메타데이터 수집
      ansible.builtin.shell: |
        awk -F: '
          NR == FNR {
            shell[$1]=$7
            next
          }
          ($1 in shell) && shell[$1] !~ /(nologin|false)$/ {
            # 두 번째 필드는 상태 판정에만 사용하고 해시 자체는 출력하지 않는다.
            if ($2 == "") password_state="empty"
            else if ($2 ~ /^(!|\*)/) password_state="locked"
            else password_state="configured"
            printf "%s:password_state=%s:last_change=%s:min_days=%s:max_days=%s:warn_days=%s:inactive_days=%s:account_expire=%s\n", $1, password_state, $3, $4, $5, $6, $7, $8
          }
        ' /etc/passwd /etc/shadow
      args:
        executable: /bin/bash
      register: account_security_metadata
      changed_when: false
      no_log: true

    - name: 최근 로그인 정보 수집
      ansible.builtin.command: lastlog
      register: last_login
      changed_when: false
      failed_when: false

    - name: 최근 로그인 및 로그아웃 세션 수집
      ansible.builtin.command: last -F -n 100
      register: login_sessions
      changed_when: false
      failed_when: false

    - name: 현재 faillock 잠금 기록 수집
      ansible.builtin.command: faillock
      register: faillock_status
      changed_when: false
      failed_when: false

    - name: 서버별 계정점검 보고서 저장
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/account-access/{{ ansible_date_time.date }}/{{ inventory_hostname }}-{{ ansible_date_time.time | regex_replace(':', '') }}.json"
        mode: "0600"
        content: >-
          {{
            {
              'collected_at': ansible_date_time.iso8601,
              'inventory_hostname': inventory_hostname,
              'login_capable_accounts': login_capable_accounts.stdout_lines | default([]),
              'administrative_groups': administrative_groups.stdout_lines | default([]),
              'account_security_metadata': account_security_metadata.stdout_lines | default([]),
              'last_login': last_login.stdout_lines | default([]),
              'login_sessions': login_sessions.stdout_lines | default([]),
              'faillock_status': faillock_status.stdout_lines | default([])
            } | to_nice_json
          }}
      delegate_to: localhost
      become: false
