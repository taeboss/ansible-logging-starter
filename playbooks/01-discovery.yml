---
- name: 로깅 정책 적용 전 읽기 전용 현황수집
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 20

  pre_tasks:
    - name: 로컬 보고서 디렉터리 생성
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
    - name: 서비스 정보 수집
      ansible.builtin.service_facts:

    - name: LISTEN 포트 및 프로세스 수집
      ansible.builtin.command: ss -lntup
      register: listening_services
      changed_when: false
      failed_when: false

    - name: 시간 동기화 상태 수집
      ansible.builtin.shell: |
        if command -v chronyc >/dev/null 2>&1; then
          chronyc tracking
          chronyc sources -n
        elif command -v timedatectl >/dev/null 2>&1; then
          timedatectl status
        elif command -v ntpq >/dev/null 2>&1; then
          ntpq -pn
        else
          echo "NO_SUPPORTED_TIME_CLIENT"
        fi
      args:
        executable: /bin/bash
      register: time_status
      changed_when: false
      failed_when: false

    - name: 로그 파일시스템 용량 수집
      ansible.builtin.command: df -P /var/log
      register: log_disk
      changed_when: false

    - name: 최근 로그인 정보 수집
      ansible.builtin.command: lastlog
      register: last_login
      changed_when: false
      failed_when: false

    - name: 최근 로그인 및 로그아웃 세션 수집
      ansible.builtin.command: last -F -n 100
      register: login_sessions
      changed_when: false
      failed_when: false

    - name: 서버별 JSON 보고서 저장
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}.json"
        mode: "0600"
        content: >-
          {{
            {
              'collected_at': ansible_date_time.iso8601,
              'inventory_hostname': inventory_hostname,
              'ansible_host': ansible_host | default(inventory_hostname),
              'distribution': ansible_distribution,
              'distribution_version': ansible_distribution_version,
              'os_family': ansible_os_family,
              'kernel': ansible_kernel,
              'architecture': ansible_architecture,
              'python_version': ansible_python_version,
              'service_manager': ansible_service_mgr,
              'package_manager': ansible_pkg_mgr,
              'log_profile': log_profile | default('undefined'),
              'listening_services': listening_services.stdout_lines | default([]),
              'time_status': time_status.stdout_lines | default([]),
              'log_disk': log_disk.stdout_lines | default([]),
              'last_login': last_login.stdout_lines | default([]),
              'login_sessions': login_sessions.stdout_lines | default([]),
              'services': ansible_facts.services | default({})
            } | to_nice_json
          }}
      delegate_to: localhost
      become: false
