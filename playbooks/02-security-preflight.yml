---
- name: 보안 정책 적용 전 읽기 전용 사전점검
  hosts: linux_servers
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0

  vars:
    preflight_config_paths:
      - /etc/ssh/sshd_config
      - /etc/pam.d/system-auth
      - /etc/pam.d/password-auth
      - /etc/pam.d/common-auth
      - /etc/pam.d/common-password
      - /etc/security/pwquality.conf
      - /etc/security/faillock.conf
      - /etc/audit/auditd.conf
      - /etc/audit/rules.d
      - /etc/systemd/journald.conf
      - /etc/rsyslog.conf

  pre_tasks:
    - name: 로컬 사전점검 보고서 디렉터리 생성
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/preflight/{{ ansible_date_time.date }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

  tasks:
    - name: 서비스 정보 수집
      ansible.builtin.service_facts:

    - name: SSH 유효 보안 설정과 구문 상태 수집
      ansible.builtin.shell: |
        if ! command -v sshd >/dev/null 2>&1; then
          echo "sshd_status=missing"
          exit 0
        fi
        if sshd -t; then
          echo "sshd_config_valid=true"
        else
          echo "sshd_config_valid=false"
        fi
        sshd -T 2>/dev/null | awk '
          $1 ~ /^(permitrootlogin|passwordauthentication|pubkeyauthentication|permitemptypasswords|usepam|maxauthtries|logingracetime|banner|loglevel|allowusers|allowgroups|denyusers|denygroups)$/ { print }
        '
      args:
        executable: /bin/bash
      register: ssh_effective_policy
      changed_when: false
      failed_when: false

    - name: PAM 정책 관련 활성 행 수집
      ansible.builtin.shell: |
        files=(
          /etc/pam.d/system-auth
          /etc/pam.d/password-auth
          /etc/pam.d/common-auth
          /etc/pam.d/common-password
        )
        for file in "${files[@]}"; do
          if [ -r "$file" ]; then
            printf '[%s]\n' "$file"
            grep -E '^[[:space:]]*(auth|account|password)[[:space:]].*(pam_faillock|pam_tally2|pam_pwquality|pam_pwhistory|pam_unix|pam_sss)' "$file" || true
          fi
        done
      args:
        executable: /bin/bash
      register: pam_policy_lines
      changed_when: false
      failed_when: false

    - name: 인증 구성 관리자와 중앙인증 상태 수집
      ansible.builtin.shell: |
        if command -v authselect >/dev/null 2>&1; then
          echo '[authselect]'
          authselect current 2>&1 || true
        else
          echo 'authselect=absent'
        fi
        if command -v pam-auth-update >/dev/null 2>&1; then
          echo 'pam_auth_update=present'
        else
          echo 'pam_auth_update=absent'
        fi
        if command -v systemctl >/dev/null 2>&1; then
          echo "sssd_active=$(systemctl is-active sssd 2>/dev/null || true)"
          echo "sssd_enabled=$(systemctl is-enabled sssd 2>/dev/null || true)"
        fi
        awk '/^(passwd|group|shadow):/ { print }' /etc/nsswitch.conf 2>/dev/null || true
      args:
        executable: /bin/bash
      register: authentication_backend
      changed_when: false

    - name: 계정 및 비밀번호 상태 메타데이터 수집
      ansible.builtin.shell: |
        uid_min=$(awk '/^UID_MIN[[:space:]]/ { print $2; exit }' /etc/login.defs)
        uid_min=${uid_min:-1000}
        echo '[accounts]'
        awk -F: -v uid_min="$uid_min" '
          {
            if ($3 == 0) class="uid0"
            else if ($3 >= uid_min && $7 !~ /(nologin|false)$/) class="human_candidate"
            else if ($3 < uid_min && $7 !~ /(nologin|false)$/) class="service_login_candidate"
            else class="non_login"
            printf "%s:uid=%s:gid=%s:home=%s:shell=%s:class=%s\n", $1, $3, $4, $6, $7, class
          }
        ' /etc/passwd
        echo '[duplicate-uids]'
        awk -F: '{ names[$3]=names[$3] "," $1; count[$3]++ } END { for (uid in count) if (count[uid] > 1) print "uid=" uid ":accounts=" substr(names[uid], 2) }' /etc/passwd
        echo '[password-state]'
        awk -F: -v uid_min="$uid_min" '
          NR == FNR { uid[$1]=$3; next }
          ($1 in uid) {
            if ($2 == "") state="empty"
            else if ($2 ~ /^(!|\*)/) state="locked"
            else state="configured"
            printf "%s:state=%s:last_change=%s:min_days=%s:max_days=%s:warn_days=%s:expire=%s\n", $1, state, $3, $4, $5, $6, $8
          }
        ' /etc/passwd /etc/shadow
      args:
        executable: /bin/bash
      register: account_policy_metadata
      changed_when: false
      no_log: true

    - name: audit 상태와 현재 규칙 수집
      ansible.builtin.shell: |
        if command -v auditctl >/dev/null 2>&1; then
          echo '[status]'
          auditctl -s 2>&1 || true
          echo '[rules]'
          auditctl -l 2>&1 || true
        else
          echo 'auditctl=absent'
        fi
      args:
        executable: /bin/bash
      register: audit_preflight
      changed_when: false

    - name: 로그 파일시스템과 현재 사용량 수집
      ansible.builtin.shell: |
        df -PT /var/log
        df -Pi /var/log
        du -sx /var/log/audit 2>/dev/null || true
        journalctl --disk-usage 2>/dev/null || true
      args:
        executable: /bin/bash
      register: log_capacity_preflight
      changed_when: false

    - name: 보안 설정파일 메타데이터와 체크섬 수집
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop: "{{ preflight_config_paths }}"
      register: security_config_metadata

    - name: 서버별 사전점검 보고서 저장
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/preflight/{{ ansible_date_time.date }}/{{ inventory_hostname }}-{{ ansible_date_time.time | regex_replace(':', '') }}.json"
        mode: "0600"
        content: >-
          {{
            {
              'collected_at': ansible_date_time.iso8601,
              'inventory_hostname': inventory_hostname,
              'distribution': ansible_distribution,
              'distribution_version': ansible_distribution_version,
              'ssh_effective_policy': ssh_effective_policy.stdout_lines | default([]),
              'pam_policy_lines': pam_policy_lines.stdout_lines | default([]),
              'authentication_backend': authentication_backend.stdout_lines | default([]),
              'account_policy_metadata': account_policy_metadata.stdout_lines | default([]),
              'audit_preflight': audit_preflight.stdout_lines | default([]),
              'log_capacity': log_capacity_preflight.stdout_lines | default([]),
              'security_config_metadata': security_config_metadata.results | default([])
            } | to_nice_json
          }}
      delegate_to: localhost
      become: false
