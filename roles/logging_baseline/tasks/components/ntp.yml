---
- name: Ubuntu/Debian NTP 패키지 설치 전 apt 캐시 갱신
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: chrony 패키지 설치
  ansible.builtin.package:
    name: chrony
    state: present

- name: chrony 설치 후 시간 서비스 현황 갱신
  ansible.builtin.service_facts:

- name: 기존 시간 동기화 서비스 중지 및 비활성화
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ legacy_time_services }}"
  when: item in ansible_facts.services

- name: chrony 설정 설치
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ chrony_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart chrony

- name: chrony 서비스 활성화
  ansible.builtin.service:
    name: "{{ chrony_service_name }}"
    enabled: true
    state: started

- name: 시간 동기화 서비스 상태 갱신
  ansible.builtin.service_facts:

- name: chrony 실행 상태 검증
  ansible.builtin.assert:
    that:
      - chrony_service_unit in ansible_facts.services
      - ansible_facts.services[chrony_service_unit].state == 'running'
    fail_msg: "{{ chrony_service_unit }}가 실행되고 있지 않습니다."

- name: 기존 시간 동기화 서비스 중지 상태 검증
  ansible.builtin.assert:
    that:
      - >-
        item not in ansible_facts.services or
        ansible_facts.services[item].state != 'running'
    fail_msg: "{{ item }}가 chrony와 동시에 실행 중입니다."
  loop: "{{ legacy_time_services }}"
