---
- name: 지원 OS 계열 확인
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: >-
      지원하지 않는 OS입니다:
      {{ ansible_distribution }} {{ ansible_distribution_version }}

- name: OS별 서비스 및 설정 경로 결정
  ansible.builtin.set_fact:
    ssh_service_name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    chrony_service_name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    chrony_service_unit: "{{ 'chrony.service' if ansible_os_family == 'Debian' else 'chronyd.service' }}"
    chrony_config_path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    audit_package_name: "{{ 'auditd' if ansible_os_family == 'Debian' else 'audit' }}"

- name: Ubuntu/Debian apt 캐시 갱신
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: 로깅 필수 패키지 설치
  ansible.builtin.package:
    name:
      - "{{ audit_package_name }}"
      - rsyslog
      - chrony
    state: present

- name: chrony 설치 후 시간 서비스 현황 갱신
  ansible.builtin.service_facts:

- name: 기존 시간 동기화 서비스 중지 및 비활성화
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ legacy_time_services }}"
  when: item in ansible_facts.services

- name: 로그 관리자 그룹 생성
  ansible.builtin.group:
    name: "{{ log_admin_group }}"
    system: true
    state: present

- name: 준수 점검 로그 디렉터리 생성
  ansible.builtin.file:
    path: /var/log/compliance
    state: directory
    owner: root
    group: "{{ log_admin_group }}"
    mode: "0750"

- name: 콘솔 로그인 전 경고문 설치
  ansible.builtin.template:
    src: issue.j2
    dest: /etc/issue
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: SSH 로그인 전 경고문 설치
  ansible.builtin.template:
    src: issue.j2
    dest: /etc/issue.net
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: 콘솔 로그인 프로그램의 호스트명 비노출 지원 확인
  ansible.builtin.command: /sbin/agetty --help
  register: agetty_help
  changed_when: false
  check_mode: false
  when: console_hide_hostname | bool

- name: 콘솔 로그인 프로그램의 호스트명 비노출 지원 검증
  ansible.builtin.assert:
    that:
      - "'--nohostname' in agetty_help.stdout"
    fail_msg: 현재 agetty가 --nohostname 옵션을 지원하지 않습니다.
  when: console_hide_hostname | bool

- name: 콘솔 로그인 systemd drop-in 디렉터리 생성
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - getty@.service
    - serial-getty@.service
  when: console_hide_hostname | bool

- name: 일반 콘솔 로그인 호스트명 비노출 설정
  ansible.builtin.template:
    src: getty-no-hostname.conf.j2
    dest: /etc/systemd/system/getty@.service.d/99-no-hostname.conf
    owner: root
    group: root
    mode: "0644"
  when: console_hide_hostname | bool
  notify: Reload systemd units

- name: 시리얼 콘솔 로그인 호스트명 비노출 설정
  ansible.builtin.template:
    src: serial-getty-no-hostname.conf.j2
    dest: /etc/systemd/system/serial-getty@.service.d/99-no-hostname.conf
    owner: root
    group: root
    mode: "0644"
  when: console_hide_hostname | bool
  notify: Reload systemd units

- name: 비활성화된 콘솔 로그인 호스트명 비노출 설정 제거
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/getty@.service.d/99-no-hostname.conf
    - /etc/systemd/system/serial-getty@.service.d/99-no-hostname.conf
  when: not (console_hide_hostname | bool)
  notify: Reload systemd units

- name: 콘솔 로그인 systemd 설정 반영
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: 콘솔 로그인 유효 실행 명령 조회
  ansible.builtin.command: >-
    systemctl show {{ item }} --property=ExecStart --value
  loop:
    - getty@tty1.service
    - serial-getty@ttyS0.service
  register: console_getty_effective_commands
  changed_when: false
  when:
    - console_hide_hostname | bool
    - not ansible_check_mode

- name: 콘솔 로그인 호스트명 비노출 유효 설정 검증
  ansible.builtin.assert:
    that:
      - "'--nohostname' in item.stdout"
    fail_msg: "{{ item.item }}의 유효 실행 명령에 --nohostname이 없습니다."
  loop: "{{ console_getty_effective_commands.results | default([]) }}"
  when:
    - console_hide_hostname | bool
    - not ansible_check_mode

- name: SSH 경고문과 상세 인증 로그 설정
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { regexp: '^\s*#?\s*Banner\s+', line: 'Banner /etc/issue.net' }
    - { regexp: '^\s*#?\s*LogLevel\s+', line: 'LogLevel VERBOSE' }
  notify: Reload SSH

- name: Ubuntu/Debian SSH 배포판 버전 기존 설정 제거
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*DebianBanner\s+'
    state: absent
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  when: ansible_os_family == 'Debian'
  notify: Reload SSH

- name: Ubuntu/Debian SSH 배포판 버전 비노출 설정
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: 'DebianBanner no'
    insertbefore: '^\s*(Include|Match)\s+'
    firstmatch: true
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  when: ansible_os_family == 'Debian'
  notify: Reload SSH

- name: SSH 유효 설정 조회
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_effective_configuration
  changed_when: false
  when: not ansible_check_mode

- name: 로그인 전 SSH 비노출 설정 검증
  ansible.builtin.assert:
    that:
      - "'banner /etc/issue.net' in ssh_effective_configuration.stdout_lines"
      - >-
        ansible_os_family != 'Debian' or
        'debianbanner no' in ssh_effective_configuration.stdout_lines
    fail_msg: SSH Banner 또는 DebianBanner 유효 설정이 예상과 다릅니다.
  when: not ansible_check_mode

- name: chrony 설정 설치
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ chrony_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart chrony

- name: journald drop-in 디렉터리 확인
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: journald 영구 보존 설정 설치
  ansible.builtin.template:
    src: journald-security.conf.j2
    dest: /etc/systemd/journald.conf.d/60-security.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: audit 대상 경로 존재 여부 확인
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ audit_sensitive_paths }}"
  register: audit_path_stats

- name: audit 규칙 설치
  ansible.builtin.template:
    src: 50-security-baseline.rules.j2
    dest: /etc/audit/rules.d/50-security-baseline.rules
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Load audit rules

- name: 중앙 로그 전송 설정 설치
  ansible.builtin.template:
    src: 60-central-logging.conf.j2
    dest: /etc/rsyslog.d/60-central-logging.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
  when: central_logging_enabled | bool
  notify: Restart rsyslog

- name: 필수 서비스 활성화
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - auditd
    - rsyslog
    - "{{ chrony_service_name }}"

- name: 시간 동기화 서비스 상태 갱신
  ansible.builtin.service_facts:

- name: chrony 실행 상태 검증
  ansible.builtin.assert:
    that:
      - chrony_service_unit in ansible_facts.services
      - ansible_facts.services[chrony_service_unit].state == 'running'
    fail_msg: "{{ chrony_service_unit }}가 실행되고 있지 않습니다."

- name: 기존 시간 동기화 서비스 중지 상태 검증
  ansible.builtin.assert:
    that:
      - >-
        item not in ansible_facts.services or
        ansible_facts.services[item].state != 'running'
    fail_msg: "{{ item }}가 chrony와 동시에 실행 중입니다."
  loop: "{{ legacy_time_services }}"
