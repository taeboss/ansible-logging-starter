---
- name: U0507 Red Hat 계열 확인
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: >-
      U0507 Red Hat 계열 조치를 지원하지 않는 OS입니다:
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}

- name: U0507 Red Hat 계열 SSH 서비스 정보 수집
  ansible.builtin.service_facts:

- name: U0507 Red Hat 계열 SSH 서비스 상태 결정
  ansible.builtin.set_fact:
    u0507_ssh_service_active: >-
      {{ ansible_facts.services.get('sshd.service', {}).get('state', 'not-found')
         == 'running' }}

- name: U0507 Red Hat 계열 설치 패키지 정보 수집
  ansible.builtin.package_facts:
    manager: auto

- name: U0507 Red Hat 계열 OpenSSH 조치 대상 패키지 결정
  ansible.builtin.set_fact:
    u0507_openssh_packages: >-
      {{ ansible_facts.packages.keys()
         | select('match', '^openssh($|-)')
         | list
         | sort }}

- name: U0507 Red Hat 계열 SSH 서버 실행 조건 확인
  ansible.builtin.assert:
    that:
      - u0507_openssh_packages | length > 0
      - "'openssh-server' in u0507_openssh_packages"
    fail_msg: >-
      SSH 서비스가 실행 중이지만 openssh-server 패키지를 확인할 수 없습니다.
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 변경 전 패키지 버전 조회
  ansible.builtin.command:
    argv: >-
      {{ ['rpm', '-q', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']
         + u0507_openssh_packages }}
  register: u0507_packages_before
  changed_when: false
  check_mode: false
  when: u0507_openssh_packages | length > 0

- name: U0507 Red Hat 계열 SSH 클라이언트 버전 조회
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -V
  register: u0507_ssh_version_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: U0507 Red Hat 계열 SSH 서버 버전 조회
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -V
  register: u0507_sshd_version_before
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'openssh-server' in u0507_openssh_packages"

- name: U0507 Red Hat 계열 변경 전 SSH 설정 구문 확인
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  check_mode: false
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 OpenSSH 관련 패키지 최신 업데이트
  ansible.builtin.dnf:
    name: "{{ u0507_openssh_packages }}"
    state: latest
    update_only: true
    update_cache: true
    use_backend: auto
  register: u0507_update_result
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 추가 업데이트 여부 확인
  ansible.builtin.dnf:
    name: "{{ u0507_openssh_packages }}"
    state: latest
    update_only: true
    update_cache: false
    use_backend: auto
  check_mode: true
  register: u0507_pending_update
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 최신 패키지 적용 검증
  ansible.builtin.assert:
    that:
      - not u0507_pending_update.changed
    fail_msg: 활성 저장소에 적용 가능한 OpenSSH 관련 패키지 업데이트가 남아 있습니다.
  when:
    - u0507_ssh_service_active
    - not ansible_check_mode

- name: U0507 Red Hat 계열 변경 후 패키지 버전 조회
  ansible.builtin.command:
    argv: >-
      {{ ['rpm', '-q', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']
         + u0507_openssh_packages }}
  register: u0507_packages_after
  changed_when: false
  check_mode: false
  when: u0507_openssh_packages | length > 0

- name: U0507 Red Hat 계열 변경 후 SSH 클라이언트 버전 조회
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -V
  register: u0507_ssh_version_after
  changed_when: false
  failed_when: false
  check_mode: false

- name: U0507 Red Hat 계열 변경 후 SSH 서버 버전 조회
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -V
  register: u0507_sshd_version_after
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'openssh-server' in u0507_openssh_packages"

- name: U0507 Red Hat 계열 변경 후 SSH 설정 구문 확인
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  check_mode: false
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 변경 후 SSH 서비스 정보 수집
  ansible.builtin.service_facts:
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 SSH 서비스 실행 상태 검증
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.services.get('sshd.service', {}).get('state', 'not-found')
        == 'running'
    fail_msg: OpenSSH 패키지 작업 후 sshd 서비스가 실행 상태가 아닙니다.
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 재시작 필요 서비스 조회
  ansible.builtin.command:
    argv:
      - dnf
      - needs-restarting
      - -s
  register: u0507_restart_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: u0507_ssh_service_active

- name: U0507 Red Hat 계열 적용 결과 안내
  ansible.builtin.debug:
    msg:
      - "SSH 서비스 실행 여부: {{ u0507_ssh_service_active }}"
      - >-
        변경 전 패키지: {{ u0507_packages_before.stdout_lines
        | default(['OpenSSH 패키지 미설치']) }}
      - >-
        변경 후 패키지: {{ u0507_packages_after.stdout_lines
        | default(['OpenSSH 패키지 미설치']) }}
      - >-
        변경 전 SSH 클라이언트 버전: {{ u0507_ssh_version_before.stderr_lines
        | default(u0507_ssh_version_before.stdout_lines | default([])) }}
      - >-
        변경 후 SSH 클라이언트 버전: {{ u0507_ssh_version_after.stderr_lines
        | default(u0507_ssh_version_after.stdout_lines | default([])) }}
      - >-
        변경 전 SSH 서버 버전: {{ u0507_sshd_version_before.stderr_lines
        | default(u0507_sshd_version_before.stdout_lines | default([])) }}
      - >-
        변경 후 SSH 서버 버전: {{ u0507_sshd_version_after.stderr_lines
        | default(u0507_sshd_version_after.stdout_lines | default([])) }}
      - >-
        패키지 변경 여부: {{ u0507_update_result.changed | default(false) }}
      - >-
        재시작 대상: {{ u0507_restart_check.stdout_lines
        | default(['SSH 서비스 미실행 또는 확인 도구 미지원']) }}
      - SSH 서비스 재시작과 서버 재부팅은 자동 수행하지 않았습니다.
