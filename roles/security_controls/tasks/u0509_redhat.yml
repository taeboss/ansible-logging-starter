---
- name: U0509 Red Hat 계열 확인
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: >-
      U0509 Red Hat 계열 조치를 지원하지 않는 OS입니다:
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}

- name: U0509 Red Hat 계열 설치 패키지 정보 수집
  ansible.builtin.package_facts:
    manager: auto

- name: U0509 Red Hat 계열 glibc 조치 대상 패키지 결정
  ansible.builtin.set_fact:
    u0509_glibc_packages: >-
      {{
        (
          (
            ansible_facts.packages.keys()
            | select('match', '^glibc($|-)')
            | list
          )
          + (['nscd'] if 'nscd' in ansible_facts.packages else [])
        )
        | unique
        | sort
      }}

- name: U0509 Red Hat 계열 glibc 설치 상태 확인
  ansible.builtin.assert:
    that:
      - u0509_glibc_packages | length > 0
    fail_msg: glibc 패키지가 설치되어 있지 않아 U0509 자동 조치 대상이 아닙니다.

- name: U0509 Red Hat 계열 GCC 실행 파일 상태 확인
  ansible.builtin.stat:
    path: /usr/bin/gcc
  register: u0509_gcc_binary

- name: U0509 Red Hat 계열 변경 전 패키지 버전 조회
  ansible.builtin.command:
    argv: >-
      {{ ['rpm', '-q', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']
         + u0509_glibc_packages }}
  register: u0509_packages_before
  changed_when: false
  check_mode: false

- name: U0509 Red Hat 계열 변경 전 glibc 실행 버전 조회
  ansible.builtin.command:
    argv:
      - getconf
      - GNU_LIBC_VERSION
  register: u0509_glibc_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: U0509 Red Hat 계열 glibc 관련 패키지 최신 업데이트
  ansible.builtin.dnf:
    name: "{{ u0509_glibc_packages }}"
    state: latest
    update_only: true
    update_cache: true
    use_backend: auto
  register: u0509_update_result

- name: U0509 Red Hat 계열 추가 업데이트 여부 확인
  ansible.builtin.dnf:
    name: "{{ u0509_glibc_packages }}"
    state: latest
    update_only: true
    update_cache: false
    use_backend: auto
  check_mode: true
  register: u0509_pending_update

- name: U0509 Red Hat 계열 최신 패키지 적용 검증
  ansible.builtin.assert:
    that:
      - not u0509_pending_update.changed
    fail_msg: 활성 저장소에 적용 가능한 glibc 관련 패키지 업데이트가 남아 있습니다.
  when: not ansible_check_mode

- name: U0509 Red Hat 계열 변경 후 패키지 버전 조회
  ansible.builtin.command:
    argv: >-
      {{ ['rpm', '-q', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']
         + u0509_glibc_packages }}
  register: u0509_packages_after
  changed_when: false
  check_mode: false

- name: U0509 Red Hat 계열 변경 후 glibc 실행 버전 조회
  ansible.builtin.command:
    argv:
      - getconf
      - GNU_LIBC_VERSION
  register: u0509_glibc_after
  changed_when: false
  failed_when: false
  check_mode: false

- name: U0509 Red Hat 계열 재부팅 필요 여부 조회
  ansible.builtin.command:
    argv:
      - dnf
      - needs-restarting
      - -r
  register: u0509_reboot_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: U0509 Red Hat 계열 적용 결과 안내
  ansible.builtin.debug:
    msg:
      - "GCC 실행 파일 존재 여부: {{ u0509_gcc_binary.stat.exists }}"
      - "변경 전 패키지: {{ u0509_packages_before.stdout_lines }}"
      - "변경 후 패키지: {{ u0509_packages_after.stdout_lines }}"
      - "변경 전 glibc 실행 버전: {{ u0509_glibc_before.stdout | default('미확인') }}"
      - "변경 후 glibc 실행 버전: {{ u0509_glibc_after.stdout | default('미확인') }}"
      - "패키지 변경 여부: {{ u0509_update_result.changed }}"
      - >-
        재부팅 필요 여부: {{ 'REQUIRED' if u0509_reboot_check.rc == 1
        else ('NOT_REQUIRED' if u0509_reboot_check.rc == 0 else 'UNKNOWN') }}
      - 서비스 재시작과 서버 재부팅은 자동 수행하지 않았습니다.
