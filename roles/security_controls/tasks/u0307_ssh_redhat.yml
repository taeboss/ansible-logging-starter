---
- name: U0307 Red Hat 계열 SSH 서비스 정보 설정
  ansible.builtin.set_fact:
    u0307_ssh_service_name: sshd
    u0307_ssh_service_unit: sshd.service
    u0307_ssh_config_block: |
      Banner /etc/issue.net
      VersionAddendum none

- name: U0307 공통 SSH 배너 조치 실행
  ansible.builtin.import_tasks: u0307_ssh.yml
