---
ansible_user: ansible-admin
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519
ansible_become: true

# 승인된 고정 문구만 사용합니다. 호스트명, OS, 버전 변수는 넣지 않습니다.
login_warning_text: |
  WARNING: Authorized users only.
  All activities may be monitored and recorded.

log_admin_group: logadmin
# 전체 대상 서버에 동일하게 적용할 단일 프로필입니다.
log_profile: raw
local_log_retention_days: 365
journal_max_use: 4G
log_filesystem_warning_percent: 80
log_filesystem_critical_percent: 90

# 실제 사용 전 조직에서 허용한 서버로 교체하십시오.
# 외부 NTP에 직접 연결하기보다 내부 NTP를 두는 구성이 권장됩니다.
ntp_servers:
  - time.kaist.ac.kr
  - time.nist.gov
ntp_max_offset_seconds: 1.0

# 중앙 로그/SIEM 확정 후 true로 변경합니다.
central_logging_enabled: false
central_log_host: log.example.internal
central_log_port: 6514
central_log_protocol: tcp
central_log_tls_enabled: true

# 중요 경로만 감사합니다. 전체 파일 접근 감사는 로그 폭증을 유발합니다.
audit_sensitive_paths:
  - { path: /etc/passwd, permissions: wa, key: identity }
  - { path: /etc/group, permissions: wa, key: identity }
  - { path: /etc/shadow, permissions: wa, key: identity }
  - { path: /etc/gshadow, permissions: wa, key: identity }
  - { path: /etc/sudoers, permissions: wa, key: privilege }
  - { path: /etc/sudoers.d, permissions: wa, key: privilege }
  - { path: /etc/ssh/sshd_config, permissions: wa, key: ssh_config }
  - { path: /etc/pam.d, permissions: wa, key: pam_config }
  - { path: /etc/crontab, permissions: wa, key: cron }
  - { path: /etc/cron.d, permissions: wa, key: cron }
  - { path: /etc/hosts, permissions: wa, key: network_config }
  - { path: /etc/resolv.conf, permissions: wa, key: network_config }
  - { path: /etc/sysctl.conf, permissions: wa, key: kernel_config }
